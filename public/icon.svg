<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E676;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00C853;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="32" fill="#0D1117"/>

  <!-- Signal waves -->
  <path d="M 100 45 A 60 60 0 0 1 160 105" fill="none" stroke="#00E676" stroke-width="3" stroke-linecap="round" opacity="0.2"/>
  <path d="M 100 55 A 48 48 0 0 1 148 103" fill="none" stroke="#00E676" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <path d="M 100 65 A 36 36 0 0 1 136 101" fill="none" stroke="#00E676" stroke-width="3" stroke-linecap="round" opacity="0.65"/>

  <!-- Map Pin -->
  <path d="M 100 30 C 68 30 45 55 45 82 C 45 118 100 170 100 170 C 100 170 155 118 155 82 C 155 55 132 30 100 30 Z" 
        fill="url(#greenGrad)" filter="url(#glow)"/>
  <!-- Pin inner circle -->
  <circle cx="100" cy="77" r="24" fill="#0D1117" opacity="0.85"/>
  <!-- Number 3 -->
  <text x="100" y="87" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="800" fill="#00E676" text-anchor="middle">3</text>
</svg>