<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="600" height="160">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00E676;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00C853;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2332;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1117;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="160" rx="16" fill="#0D1117"/>

  <!-- Icon: Map Pin with Signal Waves (represents Local SEO dominance) -->
  <g transform="translate(40, 20)" filter="url(#shadow)">
    <!-- Outer signal ring 3 -->
    <path d="M 60 35 A 45 45 0 0 1 105 80" fill="none" stroke="#00E676" stroke-width="2.5" stroke-linecap="round" opacity="0.25"/>
    <!-- Outer signal ring 2 -->
    <path d="M 60 45 A 35 35 0 0 1 95 80" fill="none" stroke="#00E676" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
    <!-- Outer signal ring 1 -->
    <path d="M 60 55 A 25 25 0 0 1 85 80" fill="none" stroke="#00E676" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

    <!-- Map Pin -->
    <path d="M 60 20 C 35 20 18 40 18 62 C 18 90 60 120 60 120 C 60 120 102 90 102 62 C 102 40 85 20 60 20 Z" 
          fill="url(#greenGrad)" filter="url(#glow)"/>
    <!-- Pin inner circle -->
    <circle cx="60" cy="58" r="18" fill="#0D1117" opacity="0.85"/>
    <!-- Number 3 inside pin (Top 3 Map Pack) -->
    <text x="60" y="66" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="800" fill="#00E676" text-anchor="middle">3</text>
  </g>

  <!-- Text: TIER3 -->
  <text x="170" y="92" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="56" font-weight="800" fill="#FFFFFF" letter-spacing="2">TIER</text>
  <text x="340" y="92" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="56" font-weight="800" fill="url(#greenGrad)" letter-spacing="2">3</text>

  <!-- Text: LABS -->
  <text x="380" y="92" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="56" font-weight="300" fill="#8B949E" letter-spacing="6">LABS</text>

  <!-- Tagline -->
  <text x="172" y="118" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500" fill="#00E676" letter-spacing="4" opacity="0.8">DOMINATE THE MAP PACK</text>

  <!-- Subtle bottom accent line -->
  <rect x="170" y="128" width="120" height="2" rx="1" fill="url(#greenGrad)" opacity="0.4"/>
</svg>